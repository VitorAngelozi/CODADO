# docker-compose.yml
# Para rodar o backend Node.js localmente em container

services:
  # Servidor API (Node.js + Express)
  api:
    container_name: qiabaco-api
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SANDBOX_HOST_PREFIX=/c/Users/insted/Documents/Codaco/codado-sandbox
      - SANDBOX_WORK_ROOT=/mnt/sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./codado-sandbox:/mnt/sandbox
