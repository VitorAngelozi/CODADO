# docker-compose.yml
# Para rodar o backend Go localmente em container

services:
  api-go:
    container_name: codado-api-go
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SANDBOX_HOST_PREFIX=${SANDBOX_HOST_PREFIX:-/c/Users/insted/Documents/Codaco/codado-sandbox}
      - SANDBOX_WORK_ROOT=/mnt/sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./codado-sandbox:/mnt/sandbox
