# docker-compose.yml
# Para rodar o backend Go localmente em container

services:
  postgres:
    image: postgres:16-alpine
    container_name: codado-postgres
    environment:
      POSTGRES_DB: codado
      POSTGRES_USER: codado
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - codado-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codado -d codado"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-go:
    container_name: codado-api-go
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://codado:postgres@postgres:5432/codado?sslmode=disable
      - FRONTEND_ORIGIN=http://localhost:5173
      - AUTH_COOKIE_SECURE=false
      - SANDBOX_HOST_PREFIX=${SANDBOX_HOST_PREFIX:-/c/Users/insted/Documents/Codaco/codado-sandbox}
      - SANDBOX_WORK_ROOT=/mnt/sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./codado-sandbox:/mnt/sandbox

volumes:
  codado-postgres-data:
